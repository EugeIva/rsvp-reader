<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tauri + SvelteKit + Typescript App</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <script>
      // Diagnostics: capture uncaught errors/rejections for debugging blank screens.
      window.__rsvpErrors = [];
      window.addEventListener("error", function (e) {
        window.__rsvpErrors.push("[error] " + e.message + " @ " + (e.filename || "") + ":" + (e.lineno || 0));
      });
      window.addEventListener("unhandledrejection", function (e) {
        var r = e.reason;
        window.__rsvpErrors.push("[unhandledrejection] " + ((r && r.message) ? r.message : String(r)));
      });
    </script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
