[package]
name = "rsvp-reader"
version = "0.1.0"
description = "Desktop EPUB reader with page and RSVP (speed reading) modes"
authors = ["eugene"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rsvp_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rbook = "0.7"
imagesize = "0.14"
percent-encoding = "2"

# When this feature is enabled, the frontend is embedded into the binary and
# the app is self-contained. `tauri dev` builds without it and uses the Vite
# dev server; standalone builds must enable it or they ship with no UI assets.
[features]
custom-protocol = ["tauri/custom-protocol"]


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
